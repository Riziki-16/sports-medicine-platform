<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clean Sport Kenya</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="detail.css">
</head>

<body>

    <nav>
        <a href="#">HOME</a>
        <a href="#" class="active">SEARCH</a>
        <a href="#">HELP</a>
        <a href="#">FAQS</a>
    </nav>

    <h1>Clean Sport Kenya</h1>

    <h2>Search Form</h2>

    <form id="searchForm">

        <label for="userType">User Type:</label>

        <select id="userType" name="userType">
            <option value="" disabled selected>Select user type</option>
            <option value="athlete">Athlete</option>
            <option value="pharmacist">Pharmacist</option>
            <option value="sport administrator">Sports Administrator</option>
            <option value="parent">Parent</option>
            <option value="other">Other</option>
        </select>

        <label for="sport">Sport:</label>

        <select id="sport" name="sport">
            <option value="" disabled selected>Select sport</option>
            <option value="Track & Field">Track & Field</option>
            <option value="football">Football</option>
            <option value="volleyball">Volleyball</option>
            <option value="basketball">Basketball</option>
            <option value="rugby ">Rugby </option>
            <option value="cricket">Cricket</option>
            <option value="motor sport">Motor Sport</option>
            <option value="swimming ">Swimming </option>
            <option value="handball">Handball</option>
            <option value="baseball">Baseball</option>
            <option value="boxing">Boxing</option>
            <option value="wheight lifting">Weight Lifting</option>
            <option value="hockey">Hockey</option>
            <option value="archery">Archery</option>
        </select>

        <label for="country">Nation of Purchase:</label>

        <select id="country" name="country">
            <option value="" disabled selected>Select country</option>

            <option value="Australia">Australia</option>
            <option value="Canada">Canada</option>
            <option value="China">China</option>
            <option value="France">France</option>
            <option value="Germany">Germany</option>
            <option value="Ghana">Ghana</option>
            <option value="India">India</option>
            <option value="Japan">Japan</option>
            <option value="Kenya">Kenya</option>
            <option value="Nigeria">Nigeria</option>
            <option value="Rwanda">Rwanda</option>
            <option value="South Africa">South Africa</option>
            <option value="Tanzania">Tanzania</option>
            <option value="Uganda">Uganda</option>
            <option value="United Kingdom">United Kingdom</option>
            <option value="United States">United States</option>
        </select>

        <label for="search">Medicine/Substance:</label>

        <input
            type="text"
            id="search"
            name="search"
            placeholder="Enter medicine or substance"
            list="medicineNames"
        >

      <h2 class="scan-heading">Scan Your Medicine</h2>

<div class="medicine-scanner">

    <div class="scanner-icon">📷</div>

    <h3>Identify Your Medicine</h3>

    <p>
        Take a photo of your medicine package or upload an image
        to find its information.
    </p>

    <label for="medicineImage" class="upload-area">

        <span class="upload-icon">＋</span>

        <strong>Take or upload a photo</strong>

        <small>JPG or PNG</small>

    </label>

    <input
        type="file"
        id="medicineImage"
        accept="image/*"
        capture="environment"
        hidden
    >

    <div id="scanPreview"></div>

    <button type="button" id="scanMedicine" class="scan-button">
        Scan Medicine
    </button>

</div>
        <datalist id="medicineNames">

            <option value="Paracetamol">
            <option value="Ibuprofen">

            <option value="1-Androstenediol">
            <option value="1-Androstenedione">
            <option value="1-Androsterone">
            <option value="1-Epiandrosterone">
            <option value="1-Testosterone">
            <option value="4-Androstenediol">
            <option value="4-Hydroxytestosterone">
            <option value="5-Androstenedione">
            <option value="7α-hydroxy-DHEA">
            <option value="7β-hydroxy-DHEA">
            <option value="7-Keto-DHEA">
            <option value="17α-methylepithiostanol">
            <option value="19-Norandrostenediol">
            <option value="19-Norandrostenedione">
            <option value="Androstanolone">
            <option value="Androstenediol">
            <option value="Androstenedione">
            <option value="Bolasterone">
            <option value="Boldenone">
            <option value="Boldione">
            <option value="Calusterone">
            <option value="Clostebol">

        </datalist>

        <button type="submit">Search</button>

    </form>

    <h2>Search Results</h2>
    <div id="results">
    <div class="results-header">
        <strong>Total Results:</strong> 0
    </div>

    <div class="formulation-list">
        <div class="formulation-title">
            Formulation Name
        </div>
    </div>
    </div>


    <footer>
    <p>&copy; 2026 Akili EdTech. All Rights Reserved.</p>
</footer>

    <script src="script.js"></script>

</body>
</html>
